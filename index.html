/* ---------- Routeur ---------- */
function route() {
  const path = (location.hash.replace(/^#/, '') || '/').split('?')[0];
  const main = document.getElementById('main');
  let html, tocItems = null;

  const r = path.startsWith('/realisations/') && REALISATIONS.find(x => '/realisations/' + x.id === path);
  if (r) {
    html = realisationView(r);
  } else if (VIEWS[path]) {
    html = VIEWS[path]();
  } else {
    location.hash = '#/'; return;
  }

  main.innerHTML = `<article class="fade">${html}</article>`;

  // Table des matières auto pour les pages avec plusieurs sections
  if (!tocItems) {
    const h2s = [...main.querySelectorAll('h2[id]')];
    if (h2s.length >= 3) tocItems = h2s.map(h => [h.id, h.textContent]);
  }
  if (tocItems) {
    main.classList.remove('no-toc');
    main.insertAdjacentHTML('beforeend', toc(tocItems));
    main.querySelectorAll('.toc a').forEach(a => a.addEventListener('click', e => {
      e.preventDefault();
      document.getElementById(a.dataset.target)?.scrollIntoView();
    }));
  } else {
    main.classList.add('no-toc');
  }

  if (path === '/contact') initContactForm();

  const titre = (PAGES.find(p => p.path === path) || {}).titre;
  document.title = (path === '/' ? '' : titre + ' — ') + PROFIL.nom + ' · Portfolio SISR';
  renderSidebar(path);
  document.body.classList.remove('nav-open');
  document.getElementById('menuBtn').setAttribute('aria-expanded', 'false');
  window.scrollTo(0, 0);
}

function closeLightbox() { lightbox.classList.remove('open'); document.body.style.overflow = ''; }
document.addEventListener('click', (e) => {
  const b = e.target.closest('.shot-img');
  if (b) {
    document.getElementById('lbImg').src = b.dataset.full;
    document.getElementById('lbImg').alt = b.dataset.cap;
    document.getElementById('lbCap').textContent = b.dataset.cap;
    lightbox.classList.add('open'); document.body.style.overflow = 'hidden';
    document.getElementById('lbClose').focus();
  } else if (e.target === lightbox || e.target.closest('#lbClose')) {
    closeLightbox();
  }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && lightbox.classList.contains('open')) closeLightbox(); });

  const status = document.getElementById('formStatus');
  const btn = form.querySelector('button[type=submit]');
  const show = (type, msg) => { status.className = 'form-status ' + type; status.textContent = msg; };

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const d = Object.fromEntries(new FormData(form));
    if (d.botcheck) return; // robot détecté : on ignore
    if (!d.name.trim() || !d.message.trim() || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.email)) {
      show('err', 'Merci de renseigner votre nom, une adresse email valide et votre message.');
      return;
    }
    if (!PROFIL.cleFormulaire) {
      show('err', "Le formulaire n'est pas encore activé. Vous pouvez m'écrire directement à " + PROFIL.email + '.');
      return;
    }
    btn.disabled = true;
    show('ok', 'Envoi en cours…');
    try {
      const res = await fetch('https://api.web3forms.com/submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
        body: JSON.stringify({
          access_key: PROFIL.cleFormulaire,
          subject: 'Portfolio — ' + (d.objet.trim() || 'Nouveau message') + ' (' + d.name.trim() + ')',
          from_name: 'Portfolio Selvame Srinivassane',
          name: d.name.trim(),
          email: d.email.trim(),
          replyto: d.email.trim(),
          message: d.message.trim(),
        }),
      });
      const json = await res.json().catch(() => ({}));
      if (!res.ok || json.success === false) throw new Error(json.message || res.status);
      form.reset();
      show('ok', '✓ Message envoyé ! Je vous réponds au plus vite.');
    } catch (err) {
      show('err', "L'envoi a échoué. Réessayez plus tard ou écrivez-moi directement à " + PROFIL.email + '.');
    } finally {
      btn.disabled = false;
    }
  });
}

/* ---------- Thème ---------- */
const themeBtn = document.getElementById('themeBtn');
function paintThemeBtn() {
  const dark = document.documentElement.getAttribute('data-theme') === 'dark';
  themeBtn.innerHTML = ic(dark ? 'sun' : 'moon');
}
themeBtn.addEventListener('click', () => {
  const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('theme', next); } catch (e) {}
  paintThemeBtn();
});
paintThemeBtn();

/* ---------- Menu mobile ---------- */
document.getElementById('menuBtn').addEventListener('click', (e) => {
  const open = document.body.classList.toggle('nav-open');
  e.currentTarget.setAttribute('aria-expanded', String(open));
});
document.getElementById('backdrop').addEventListener('click', () => document.body.classList.remove('nav-open'));

window.addEventListener('hashchange', route);
route();
</script>
